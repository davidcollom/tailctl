version: 2
project_name: tailctl
before:
  hooks:
    - go mod download
builds:
  - id: tailctl
    main: ./cmd/tailctl
    binary: tailctl
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{.Version}}
archives:
  - formats: [tar.gz]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [README.md, LICENSE, config.example.yaml]
checksum:
  name_template: checksums.txt
# The authenticated checksum manifest covers all release archives.
# Snapshot builds skip signing: they have no GitHub OIDC release identity.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
changelog:
  sort: asc

# The project repository doubles as its tap. No second repository or PAT needed.
homebrew_casks:
  - name: tailctl
    repository:
      owner: davidcollom
      name: tailctl
      branch: main
    directory: Casks
    homepage: https://github.com/davidcollom/tailctl
    description: Extensible Tailscale API CLI with readable output and plugins
    binaries: [tailctl]
    skip_upload: auto
    commit_msg_template: 'chore(homebrew): update tailctl to {{ .Tag }}'
    generate_completions_from_executable:
      executable: tailctl
      shell_parameter_format: cobra
      shells: [bash, zsh, fish]
    # Structured steps avoid Homebrew's deprecated Ruby flight blocks.
    # Quarantine is removed only from this binary, before completion generation.
    # Preserve Homebrew's install-time token through GoReleaser's Go templates.
    custom_block: |
      on_macos do
        preflight_steps do
          run "/bin/sh",
              args: ["-c", 'set -eu; attributes=$(/usr/bin/xattr "$1"); if printf "%s\n" "$attributes" | /usr/bin/grep -Fxq com.apple.quarantine; then /usr/bin/xattr -d com.apple.quarantine "$1"; fi', "tailctl-quarantine", "{{ "{{staged_path}}" }}/tailctl"],
              must_succeed: true
        end
      end
