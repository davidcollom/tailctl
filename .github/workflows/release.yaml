name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
# Serialize releases because each stable release updates Casks/tailctl.rb on main.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go generate ./...
      - run: git diff --exit-code
      - run: go test -race ./...
      - name: Install Cosign (version managed by its installer action)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release signature and archive checksums
        shell: bash
        env:
          RELEASE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yaml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --certificate-identity "$RELEASE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)

  homebrew-smoke:
    needs: release
    # Public downloads are the intended distribution model.
    if: ${{ !github.event.repository.private && !contains(github.ref_name, '-') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install and exercise the published cask
        shell: bash
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Homebrew is preinstalled on these GitHub-hosted runners.
          if ! command -v brew >/dev/null 2>&1; then
            eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          fi
          brew update
          brew tap davidcollom/tailctl https://github.com/davidcollom/tailctl.git
          brew install --cask davidcollom/tailctl/tailctl
          test "$(tailctl --version)" = "tailctl version ${GITHUB_REF_NAME#v}"
          tailctl api list -o json
