name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version increment (first minor release is v0.1.0)
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
permissions:
  contents: read
# Serialize releases because each stable release updates Casks/tailctl.rb on main.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  authorise:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      identity: ${{ steps.plan.outputs.identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authorise owners, require green CI and calculate version
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_BUMP: ${{ inputs.bump }}
        run: node .github/scripts/release.mjs
  release:
    needs: authorise
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: node --test .github/scripts/release.test.mjs
      - run: go vet ./...
      - run: go generate ./...
      - run: git diff --exit-code
      - run: go test -race ./...
      - name: Confirm default branch has not moved
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_PHASE: check-head
        run: node .github/scripts/release.mjs
      - name: Create next release tag (no overwrites)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.authorise.outputs.tag }}
          RELEASE_SHA: ${{ needs.authorise.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            # A failed release job can resume its own tag, but never retarget it.
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
            test "$(git for-each-ref --format='%(contents:subject)' "refs/tags/$RELEASE_TAG")" = "Release $RELEASE_TAG (run $GITHUB_RUN_ID)"
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_SHA" -m "Release $RELEASE_TAG (run $GITHUB_RUN_ID)"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - name: Install Cosign (version managed by its installer action)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ needs.authorise.outputs.tag }}

      - name: Verify release signature and archive checksums
        shell: bash
        env:
          RELEASE_IDENTITY: ${{ needs.authorise.outputs.identity }}
        run: |
          cosign verify-blob \
            --certificate-identity "$RELEASE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          (cd dist && sha256sum --check checksums.txt)

  homebrew-smoke:
    needs: [authorise, release]
    # Public downloads are the intended distribution model.
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and exercise the published cask
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.authorise.outputs.tag }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/homebrew-smoke.sh
